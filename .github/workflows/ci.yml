name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A PR that changes a package says how, in a changeset (#559): `bun run changeset`, or
  # `bun run changeset --empty` for a change no release needs to mention. From launch day (#560),
  # once the repo is public; the Version Packages PR uses its changesets up, so it's left out.
  changeset:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Changesets for the changed packages
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  check:
    # Pinned: `ubuntu-latest` moved to 26.04, where Playwright 1.59.1 can't install Chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Move it with Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SolidStart 2 (the storefront showcase's Solid 1 app, #296) needs Node 24, as the dev shell has.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The Effect-first rules on @wardic/core (ADR-0025, docs/agents/effect-first.md).
      - name: Lint
        run: bun run lint

      # Fast node tier — @wardic/core + @wardic/test (pure logic). `bun run test`
      # (vitest), NOT `bun test` (Bun's native runner, which would mis-handle the
      # @effect/vitest suites).
      - name: Test (node tier)
        run: bun run test

      # Canonical DOM tier — @wardic/dom + @wardic/solid in real Chromium. Locally
      # the browser comes from the nix devshell; on CI we install Playwright's
      # pinned browser (package.json pins playwright 1.59.1) the normal way.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Test (browser tier)
        run: bun run test:browser

      - name: Build
        run: bun run build
