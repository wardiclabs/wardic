name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Fast node tier — @wardic/core + @wardic/test (pure logic). `bun run test`
      # (vitest), NOT `bun test` (Bun's native runner, which would mis-handle the
      # @effect/vitest suites).
      - name: Test (node tier)
        run: bun run test

      # Canonical DOM tier — @wardic/dom + @wardic/solid in real Chromium. Locally
      # the browser comes from the nix devshell; on CI we install Playwright's
      # pinned browser (package.json pins playwright 1.59.1) the normal way.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Test (browser tier)
        run: bun run test:browser

      - name: Build
        run: bun run build
