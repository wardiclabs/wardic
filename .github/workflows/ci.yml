name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A PR that changes what a package ships (`changedFilePatterns`: its src, package.json, README,
  # build tsconfig; not its tests or benches) says how, in a changeset (#559): `bun run changeset`, or
  # `bun run changeset --empty` for a change no release needs to mention. From launch day (#560),
  # once the repo is public; the Version Packages PR uses its changesets up, so it's left out.
  changeset:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private && github.head_ref != 'changeset-release/main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Changesets for the changed packages
        run: bunx changeset status --since=origin/${{ github.base_ref }}

  check:
    # Pinned: `ubuntu-latest` moved to 26.04, where Playwright 1.59.1 can't install Chromium
    # ("Playwright does not support chromium on ubuntu26.04-x64"). Move it with Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SolidStart 2 (the storefront showcase's Solid 1 app, #296) needs Node 24, as the dev shell has.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The Effect-first rules on @wardic/core (ADR-0025, docs/agents/effect-first.md).
      - name: Lint
        run: bun run lint

      # Fast node tier — @wardic/core + @wardic/test (pure logic). `bun run test`
      # (vitest), NOT `bun test` (Bun's native runner, which would mis-handle the
      # @effect/vitest suites).
      - name: Test (node tier)
        run: bun run test

      # Canonical DOM tier — @wardic/dom + @wardic/solid in real Chromium. Locally
      # the browser comes from the nix devshell; on CI we install Playwright's
      # pinned browser (package.json pins playwright 1.59.1) the normal way.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Test (browser tier)
        run: bun run test:browser

      - name: Build
        run: bun run build

  # What an app ships for Wardic (#654, ADR-0067): `bun run size` builds each app as it ships, head
  # against base, and fails one whose gzip grows more than 1% over the base's, or a Slim element's app
  # past its budget. A job of its own, so a size failure doesn't hide a test failure. A PR is measured
  # against its base branch; a push to `main` against the push before, as two PRs each under a budget
  # can merge past it together.
  size:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The base side is built from its commit (`git archive`).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A base whose `bun.lock` differs installs its own dependencies first (`depsOf`, `sides.ts`).
      - name: Size
        run: bun run size --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
