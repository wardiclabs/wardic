name: Release

# Versions and publishes the four packages (#559) under Changesets: `core`, `dom` and `test` one fixed
# group, `solid` on its own since its 2.0 (#566). On each push to `main`:
# - with changesets waiting, it opens or updates the "Version Packages" PR: the new version and each
#   package's CHANGELOG. One naming only private packages that Changesets doesn't version (Foldkit's
#   until 1.2) never waits: it stays on `main` for its package's release (#566);
# - with none, that PR has just merged: it checks the tarballs (#554), then publishes each version npm
#   doesn't have yet, on `latest`; a pre release (`1.0.0-rc.N`) goes to `next` once its package has
#   a stable version on npm (`scripts/publish-packages.ts`).
#
# Publishing is npm's trusted publishing (OIDC), with provenance, so no token is kept. npm adds a
# trusted publisher only to a package that exists, so a package's first publish may take a one-off
# `NPM_TOKEN` secret, deleted once trusted publishing is set up; without the secret, the action uses
# OIDC. It runs once the repo is public: provenance needs a public repo, and until launch day (#560)
# there's nothing to release.

on:
  push:
    branches: [main]

# One release at a time, and never cut short: a publish stopped halfway leaves packages to finish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    outputs:
      publishes: ${{ steps.changesets.outputs.publishes }}
      private: ${{ steps.changesets.outputs.private }}
    steps:
      - uses: actions/checkout@v4

      # No changeset waiting: the version PR has merged, and this push publishes. What waits is the
      # script's to say: not a changeset a pre-mode version step has used (1.0.0-rc.1's run counted
      # them all, and skipped pack-check), nor one naming only private packages a version step leaves
      # alone (1.1.3's version step left one of Foldkit's behind, and #821's run took it as waiting,
      # failing to open a version PR with nothing in it, #566).
      # Leaving pre mode (`"mode": "exit"`), every one waits again, for the stable version, as
      # changesets/action counts them.
      - name: Changesets waiting
        id: changesets
        run: bash scripts/changesets-waiting.sh >> "$GITHUB_OUTPUT"

  pack-check:
    needs: plan
    if: ${{ needs.plan.outputs.publishes == 'true' }}
    uses: ./.github/workflows/pack-check.yml

  release:
    needs: [plan, pack-check]
    # The version PR when pack-check was skipped; a publish only once it passed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.pack-check.result != 'failure' }}
    # Pinned with CI's.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No registry-url: setup-node's .npmrc would ask for a token, where trusted publishing has none.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A publish: the private-only changesets out of this checkout, not out of `main`, or
      # changesets/action takes them as waiting and opens the version PR instead (#566). Publishing
      # commits nothing, so they stay for their package's release.
      - name: Set aside private-only changesets
        if: ${{ needs.plan.outputs.publishes == 'true' && needs.plan.outputs.private != '' }}
        env:
          PRIVATE: ${{ needs.plan.outputs.private }}
        run: for id in $PRIVATE; do rm -- ".changeset/$id.md"; done

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
          title: Version Packages
          commit: Version Packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
