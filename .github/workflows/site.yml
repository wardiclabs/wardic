name: Docs site

# Wardic's docs site (#558, site/): built and prerendered, then deployed to Cloudflare Pages with
# Cloudflare's wrangler-action. `main` goes to production at wardic.dev, each PR to a preview whose
# URL is posted on it. Without the Cloudflare secrets (a fork's PR, or before they're set) it builds and
# skips the deploy.
#
# Set up once in Cloudflare and the repo's settings: a Pages project named `wardic-docs` (Direct
# Upload), an API token with "Cloudflare Pages: Edit", and the repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "examples/storefront/shared/src/tokens.css"
      - "examples/storefront/shared/src/code.ts"
      - "scripts/wardic-source.ts"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "packages/*/src/**"
      - "packages/*/package.json"
      - "examples/storefront/shared/src/tokens.css"
      - "examples/storefront/shared/src/code.ts"
      - "scripts/wardic-source.ts"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  site:
    # Pinned with CI's: Playwright 1.59.1 can't install Chromium on ubuntu 26.04.
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # SolidStart 2's start mode needs Node 24, and the prerender runs on it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The site and its samples, each against its own binding.
      - name: Typecheck
        run: bun run --filter @wardic/site typecheck

      # Vite's build, then each page prerendered and indexed by Pagefind (site/scripts/prerender.ts).
      - name: Build
        run: bun run --filter @wardic/site build

      - name: Deploy
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist/client --project-name=wardic-docs --branch=${{ github.head_ref || github.ref_name }}

      # One comment per PR, updated at each push, with the preview's address.
      - name: Post the preview
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "<!-- wardic-docs-preview -->"
            const body = `${marker}\nThe docs site, as this PR builds it: ${process.env.URL}`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((comment) => comment.body?.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
